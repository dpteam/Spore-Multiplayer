; Spore Multiplayer client configuration
;
; This file is read when the game starts. It is created automatically with the
; default values if it does not exist. Reload it in game with the `mp_reload`
; cheat, or just restart Spore.

[connection]
; Address of the Spore-Multiplayer-Server.exe instance.
host=127.0.0.1
port=7000
; Name shown to the other players. Empty means "Player".
name=
; Connect automatically when the game starts.
auto_connect=0

[display]
; Show the multiplayer overlay (players, chat, ping).
hud=1
; Position of the overlay, as a fraction of the screen (0..1).
hud_x=0.02
hud_y=0.35
hud_scale=1.0
; How many chat lines are shown.
chat_lines=6

[sync]
; How many times per second the local player state is sent (1-60).
send_rate=15
; Show the other players as ships/creatures in the world.
show_avatars=1
; Smooth the movement of the other players.
interpolation=1
