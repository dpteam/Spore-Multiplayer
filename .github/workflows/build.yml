name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build mod, server and tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Set up MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      # The client links against SporeModAPIBase.lib (static) and SporeModAPI.lib
      # (import library of the ModAPI DLL). Both are built from the SDK submodule,
      # so the CI does not need the Launcher Kit installed.
      - name: Build ModAPI static library
        run: msbuild "Spore-ModAPI\Spore ModAPI\Spore ModAPI.vcxproj" /p:Configuration=Release /p:Platform=Win32 /v:minimal

      - name: Build ModAPI DLL and import library
        run: >
          msbuild "Spore-ModAPI\Spore ModAPI\Spore ModAPI.vcxproj"
          /p:Configuration="Release DLL" /p:Platform=Win32
          /p:SDK_BUILD_VER=1 /p:EXECUTABLE_TYPE=10 /v:minimal

      # The client project writes its output to $(SporeLauncherPath)mLibs and reads
      # SporeModAPI.lib from $(SporeLauncherPath)coreLibs, so we provide a minimal
      # stand-in folder instead of the real Launcher Kit.
      - name: Prepare stand-in launcher folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "kit\coreLibs" | Out-Null
          Copy-Item "Spore-ModAPI\dll\Release\SporeModAPI.lib" "kit\coreLibs\" -Force
          Get-ChildItem "kit" -Recurse | Select-Object FullName

      - name: Build client mod
        shell: pwsh
        run: |
          $kit = Join-Path (Get-Location) "kit\"
          msbuild "Client\Spore-Multiplayer-Client\Spore-Multiplayer-Client.vcxproj" `
            /p:Configuration=Release /p:Platform=Win32 /p:SporeLauncherPath="$kit" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build dedicated server
        run: msbuild "Server\Spore-Multiplayer-Server\Spore-Multiplayer-Server.vcxproj" /p:Configuration=Release /p:Platform=Win32 /v:minimal

      - name: Build master server
        run: msbuild "Server\Spore-Multiplayer-Master\Spore-Multiplayer-Master.vcxproj" /p:Configuration=Release /p:Platform=Win32 /v:minimal

      - name: Build relay server
        run: msbuild "Server\Spore-Multiplayer-Relay\Spore-Multiplayer-Relay.vcxproj" /p:Configuration=Release /p:Platform=Win32 /v:minimal

      - name: Build launcher
        run: msbuild "Server\Spore-Multiplayer-Launcher\Spore-Multiplayer-Launcher.vcxproj" /p:Configuration=Release /p:Platform=Win32 /v:minimal

      - name: Run server integration tests
        shell: pwsh
        run: |
          .\Tools\test-server.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run LAN discovery test
        shell: pwsh
        run: |
          .\Tools\test-discovery.ps1 -Port 7000 -Seconds 8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run master server test
        shell: pwsh
        run: |
          .\Tools\test-master.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run relay tests
        shell: pwsh
        run: |
          .\Tools\test-relay.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\Tools\test-relay-host.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect artifacts
        shell: pwsh
        run: |
          # One bundle with everything, laid out the way a player expects it:
          # each program in its own folder next to its configuration.
          $root = "bundle\Spore-Multiplayer"
          New-Item -ItemType Directory -Force -Path "$root\Client" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\Launcher" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\Server" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\Master" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\Relay" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\Tools" | Out-Null

          # Client mod (goes into the Launcher Kit mLibs folder)
          Copy-Item "kit\mLibs\Spore-Multiplayer-Client.dll" "$root\Client\" -Force
          Copy-Item "Client\Spore-Multiplayer-Client\SporeMultiplayer.ini" "$root\Client\" -Force

          # Launcher
          Copy-Item "Server\Spore-Multiplayer-Launcher\bin\Release\Spore-Multiplayer-Launcher.exe" "$root\Launcher\" -Force
          Copy-Item "Server\Spore-Multiplayer-Launcher\bin\Release\WebView2Loader.dll" "$root\Launcher\" -Force
          Copy-Item "Server\Spore-Multiplayer-Launcher\launcher.ini" "$root\Launcher\" -Force

          # Dedicated server
          Copy-Item "Server\Spore-Multiplayer-Server\bin\Release\Spore-Multiplayer-Server.exe" "$root\Server\" -Force
          Copy-Item "Server\Spore-Multiplayer-Server\server.ini" "$root\Server\" -Force

          # Master and relay
          Copy-Item "Server\Spore-Multiplayer-Master\bin\Release\Spore-Multiplayer-Master.exe" "$root\Master\" -Force
          Copy-Item "Server\Spore-Multiplayer-Master\master.ini" "$root\Master\" -Force
          Copy-Item "Server\Spore-Multiplayer-Relay\bin\Release\Spore-Multiplayer-Relay.exe" "$root\Relay\" -Force
          Copy-Item "Server\Spore-Multiplayer-Relay\relay.ini" "$root\Relay\" -Force

          # Helper scripts players need when reporting a problem
          Copy-Item "Tools\collect-logs.ps1" "$root\Tools\" -Force
          Copy-Item "Tools\fake-client.ps1" "$root\Tools\" -Force
          Copy-Item "README.md" "$root\" -Force
          Copy-Item "TESTING.md" "$root\" -Force

          Get-ChildItem $root -Recurse -File | Select-Object FullName, Length

      - name: Create the bundle archive
        shell: pwsh
        run: |
          $version = "${{ github.sha }}".Substring(0, 7)
          $name = "Spore-Multiplayer-$version"
          Compress-Archive -Path "bundle\Spore-Multiplayer" -DestinationPath "$name.zip" -Force
          Get-Item "$name.zip" | Select-Object Name, Length

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Spore-Multiplayer
          path: Spore-Multiplayer-*.zip
          if-no-files-found: error
