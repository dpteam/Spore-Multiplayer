# Spore Multiplayer - relay server configuration
#
# The relay lets players connect when a direct connection is impossible:
# NAT without port forwarding, CGNAT, strict firewalls, broken NAT hairpin.
# Both sides connect out to the relay, so nobody needs an open port.

# TCP port of the relay.
port=17402

# Address to bind. 0.0.0.0 listens on every interface.
bind=0.0.0.0

# A room where nobody connects is dropped after this many seconds.
timeout=120

# debug, info, warning or error.
log_level=info
