# Spore Multiplayer - launcher configuration

# Master server shown in the server list.
master=play.dartpower.xyz:17401

# Relay used when hosting from the launcher, so players behind NAT can join.
relay=play.dartpower.xyz:17402

# Folder of the ModAPI Launcher Kit (contains "Spore ModAPI Launcher.exe").
# Leave empty to detect it automatically.
launcher_kit=

# SporeMultiplayer.ini of the mod. Empty means "<launcher_kit>\mLibs\SporeMultiplayer.ini".
client_ini=

# Path of Spore-Multiplayer-Server.exe, used by the "Host" button.
# Leave empty to look next to this executable.
server_exe=

# Local address and port of the web UI. Port 0 picks a free one.
bind=127.0.0.1
port=0
