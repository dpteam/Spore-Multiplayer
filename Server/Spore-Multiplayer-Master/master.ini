# Spore Multiplayer - master server configuration
#
# Every option can also be passed on the command line; the command line wins.

# HTTP port. Point your domain at this port, e.g. play.example.com:17401
port=17401

# Address to bind. 0.0.0.0 listens on every interface.
bind=0.0.0.0

# How often the registered servers are expected to send a heartbeat, in seconds.
heartbeat=15

# A session that stops sending heartbeats is removed after this many seconds.
timeout=45

# debug, info, warning or error.
log_level=info
