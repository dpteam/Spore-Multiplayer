# Spore Multiplayer - dedicated server configuration
#
# Every option can also be passed on the command line; the command line wins.
# Copy this file next to Spore-Multiplayer-Server.exe and edit it, or start the
# server with: Spore-Multiplayer-Server.exe --config server.ini

# TCP port the clients connect to. Forward this port if the server is on the internet.
port=7000

# Address to bind. 0.0.0.0 listens on every interface, 127.0.0.1 only accepts
# connections from the same computer (useful for testing).
bind=0.0.0.0

# Name of the session, shown to the players when they connect.
session_name=Spore Co-op

# Maximum number of players in the session (1-8).
max_players=8

# How many times per second the players positions are broadcast (1-60).
tick_rate=20

# A player that does not send anything for this many seconds is disconnected.
timeout=15

# debug, info, warning or error.
log_level=info

# Allow two players to use the same name (0 or 1).
allow_duplicate_names=0
